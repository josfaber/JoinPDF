# Static site for JoinPDF. Runs inside nginx-unprivileged on port 8080,
# behind the host's reverse proxy (which terminates TLS).

# Find the visitor's IP in X-Forwarded-For: skip addresses of trusted hops,
# i.e. private networks (Docker, Newt/Pangolin) and Cloudflare's edge
# (https://www.cloudflare.com/ips, fetched 2026-11-13).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
set_real_ip_from 100.64.0.0/10;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Flood protection per client IP.
limit_req_zone  $binary_remote_addr zone=perip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=connperip:10m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    charset utf-8;

    # Nothing is ever uploaded: refuse request bodies and anything but GET/HEAD.
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 15s;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    limit_req  zone=perip burst=40 nodelay;
    limit_conn connperip 20;
    limit_req_status  429;
    limit_conn_status 429;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Hashed build assets never change.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        # /about -> about.html
        try_files $uri $uri.html $uri/ =404;
    }

    # No dotfiles or source maps.
    location ~ /\.  { return 404; }
    location ~ \.map$ { return 404; }
}
