# Static site for JoinPDF. Runs inside nginx-unprivileged on port 8080,
# behind the host's reverse proxy (which terminates TLS).

# Trust X-Forwarded-For only from private networks (the reverse proxy / Docker).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Flood protection per client IP.
limit_req_zone  $binary_remote_addr zone=perip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=connperip:10m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    charset utf-8;

    # Nothing is ever uploaded: refuse request bodies and anything but GET/HEAD.
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 15s;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    limit_req  zone=perip burst=40 nodelay;
    limit_conn connperip 20;
    limit_req_status  429;
    limit_conn_status 429;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Hashed build assets never change.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        # /about -> about.html
        try_files $uri $uri.html $uri/ =404;
    }

    # No dotfiles or source maps.
    location ~ /\.  { return 404; }
    location ~ \.map$ { return 404; }
}
