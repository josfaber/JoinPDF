name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx tsc -p .
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: --bundles nsis
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Build only; the release job below picks the files to publish.
      - uses: tauri-apps/tauri-action@action-v1.0.0
        id: tauri
        with:
          args: ${{ matrix.args }}

      - name: Collect macOS dmg
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ steps.tauri.outputs.appVersion }}
        run: |
          mkdir out
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/JoinPDF_${VERSION}_universal.dmg"

      - name: Collect Windows installer and portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.tauri.outputs.appVersion }}
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe) "out/JoinPDF_${env:VERSION}_x64-setup.exe"
          Compress-Archive -Path src-tauri/target/release/joinpdf.exe -DestinationPath "out/JoinPDF_${env:VERSION}_x64_portable.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: joinpdf-${{ runner.os }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          name: JoinPDF ${{ github.ref_name }}
          draft: true
          files: out/*
          body: |
            ### Downloads
            - **macOS** (Intel + Apple Silicon): `JoinPDF_*_universal.dmg`
            - **Windows installer** (no admin rights needed): `JoinPDF_*_x64-setup.exe`
            - **Windows portable**: `JoinPDF_*_x64_portable.zip`

            These builds are not code-signed. See the [README](https://github.com/josfaber/JoinPDF#first-launch-unsigned-app) for how to open them the first time.
