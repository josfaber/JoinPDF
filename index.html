<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JoinPDF</title>
  </head>
  <body>
    <main class="app">
      <section id="drop-zone" class="drop-zone">
        <ul id="files" class="files"></ul>
        <div id="empty-hint" class="empty-hint">
          <div class="empty-icon" aria-hidden="true">⬇</div>
          <p>Drop PDF files here</p>
          <p class="sub">or use + to add files, then drag to reorder</p>
        </div>
      </section>

      <div id="status" class="status" role="status" aria-live="polite"></div>

      <footer class="toolbar">
        <button id="add" class="btn" title="Add PDF files">＋ Add files</button>
        <button id="clear" class="btn btn-quiet">Clear</button>
        <span class="spacer"></span>
        <button id="generate" class="btn btn-primary">Generate</button>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
